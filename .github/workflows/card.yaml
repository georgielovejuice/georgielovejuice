name: Update profile card

on:
  schedule:
    - cron: "17 0 * * *"  # every day, 07:17 Bangkok time
  workflow_dispatch:
  push:
    paths:
      - "generate.py"
      - ".github/workflows/card.yaml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - run: python generate.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit the new SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || (git commit -m "Update profile card" && git push)